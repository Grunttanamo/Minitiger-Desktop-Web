name: Build Minitiger Virtual Sync Plugin

on:
  push:
    branches:
      - minitiger-desktop-v12.1
      - test/watchparty-same-server-20261014
      - test/banner-stable-111-20261016
    paths:
      - 'tools/MinitigerVirtualSync/**'
      - '.github/workflows/minitiger-plugin-build.yml'
      - '.github/workflows/minitiger-plugin-release.yml'
      - '.github/scripts/update_plugin_manifest.py'
  pull_request:
    branches:
      - minitiger-desktop-v12.1
    paths:
      - 'tools/MinitigerVirtualSync/**'
      - '.github/workflows/minitiger-plugin-build.yml'
      - '.github/workflows/minitiger-plugin-release.yml'
      - '.github/scripts/update_plugin_manifest.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore plugin
        run: dotnet restore tools/MinitigerVirtualSync/Jellyfin.Plugin.MinitigerVirtualSync.csproj

      - name: Build plugin
        run: dotnet build tools/MinitigerVirtualSync/Jellyfin.Plugin.MinitigerVirtualSync.csproj --configuration Release --no-restore

      - name: Package WatchTogether TEST companion
        if: github.ref == 'refs/heads/test/watchparty-same-server-20261014' || github.ref == 'refs/heads/test/banner-stable-111-20261016'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/minitiger-watchtogether-plugin"
          mkdir -p "$OUT"
          dotnet publish tools/MinitigerVirtualSync/Jellyfin.Plugin.MinitigerVirtualSync.csproj \
            --configuration Release --no-restore \
            --output "$OUT" \
            -p:Version=1.6.25.0 \
            -p:AssemblyVersion=1.6.25.0 \
            -p:FileVersion=1.6.25.0
          test -s "$OUT/Jellyfin.Plugin.MinitigerVirtualSync.dll"
          mkdir -p "$RUNNER_TEMP/minitiger-test-package"
          cp "$OUT/Jellyfin.Plugin.MinitigerVirtualSync.dll" "$RUNNER_TEMP/minitiger-test-package/"
          (
            cd "$RUNNER_TEMP/minitiger-test-package"
            zip -9 "$RUNNER_TEMP/Minitiger.VirtualSync_1.6.25.0-WatchTogether-TEST.zip" Jellyfin.Plugin.MinitigerVirtualSync.dll
          )

      - name: Upload installable WatchTogether TEST ZIP
        if: github.ref == 'refs/heads/test/watchparty-same-server-20261014' || github.ref == 'refs/heads/test/banner-stable-111-20261016'
        uses: actions/upload-artifact@v4
        with:
          name: Minitiger-VirtualSync-1.6.25.0-WatchTogether-TEST
          path: ${{ runner.temp }}/Minitiger.VirtualSync_1.6.25.0-WatchTogether-TEST.zip
          if-no-files-found: error
          retention-days: 14
